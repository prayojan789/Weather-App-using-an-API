<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather Now</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="app">
			<header class="hero">
				<div class="hero-top">
					<div>
						<h1>Weather Nepal</h1>
						<p>Live conditions and short-term forecast for Nepal cities.</p>
					</div>
				</div>
			</header>

			<section class="panel">
				<form id="weather-form" class="search" autocomplete="off">
					<label class="sr-only" for="city-input">City</label>
					<input
						id="city-input"
						name="city"
						type="text"
						placeholder="Enter Nepal city, e.g. Kathmandu"
						required
					/>
					<button type="submit">Get Weather</button>
				</form>

				<div class="status" id="status" aria-live="polite"></div>

				<div class="current" id="current" hidden>
					<div class="current-main">
						<div class="current-info">
							<h2 id="place">--</h2>
							<p id="desc">--</p>
						</div>
						<div class="current-icon" id="current-icon" aria-hidden="true">--</div>
					</div>
					<div class="temp">
						<span id="temp">--</span>
						<span class="unit">°C</span>
					</div>
					<div class="meta">
						<span>Feels: <strong id="feels">--</strong>°C</span>
						<span>Humidity: <strong id="humidity">--</strong>%</span>
						<span>Wind: <strong id="wind">--</strong> m/s</span>
					</div>
				</div>
			</section>
		</main>

		<script src="spript.js"></script>
	</body>
</html>
